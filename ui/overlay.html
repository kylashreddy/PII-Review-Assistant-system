<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Evaratus marks</title>
<style>
  /* Black and white: a black box around each finding with its status on a small tab;
     dashed on the original, solid on the redacted work; answered ones grey. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; pointer-events: none;
    font: 600 10.5px/1.3 -apple-system, "Segoe UI", Inter, sans-serif; }
  .frame { position: fixed; border: 1.5px dashed rgba(10,10,10,.45); border-radius: 8px; transition: border-color .4s; }
  .frame span { position: absolute; top: -21px; left: 6px; padding: 2px 8px; border-radius: 5px; color: #fff; background: #0a0a0a; opacity: 0; transition: opacity .4s; }
  body.frames .frame { border: 3px solid #0a0a0a; box-shadow: 0 0 0 2px #fff; }
  body.frames .frame span { opacity: 1; }
  /* the redacted document once nothing is left to fix: a solid frame with a tab that stays */
  .frame.done { border: 3px solid #0a0a0a; box-shadow: 0 0 0 2px #fff; }
  .frame.done span { opacity: 1; font-size: 12px; padding: 3px 10px; }
  .mark { position: fixed; border-radius: 3px; border: 2px solid #0a0a0a; box-shadow: 0 0 0 1.5px #fff;
    margin: -3px 0 0 -3px; padding: 3px; box-sizing: content-box; }
  .mark.left { border-style: dashed; }
  .mark.done { border-color: #a3a3a3; box-shadow: none; }
  .mark b { position: absolute; left: -2px; bottom: 100%; margin-bottom: 1px; white-space: nowrap; padding: 1px 6px;
    border-radius: 4px 4px 4px 0; background: #0a0a0a; color: #fff; font-weight: 600; }
  .mark.done b { background: #a3a3a3; }
  .mark.flash { animation: flash 1.6s ease-out 1; z-index: 2; }
  @keyframes flash { 0%, 45% { box-shadow: 0 0 0 1.5px #fff, 0 0 0 7px rgba(10,10,10,.35); } 100% { box-shadow: 0 0 0 1.5px #fff; } }
</style>
</head>
<body>
<script src="overlay.js"></script>
</body>
</html>
